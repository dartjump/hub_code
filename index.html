<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Hub de Projets</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0d1117;
        --surface: #161b22;
        --text: #e2e8f0;
        --accent: #58a6ff;
    }
    body {
        font-family: 'Bricolage Grotesque', sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px 20px;
    }
    h1 { margin-bottom: 40px; font-size: 2.5rem; }
    h1 span { color: var(--accent); }
    
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        width: 100%;
        max-width: 1000px;
    }
    .card {
        background: var(--surface);
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 25px;
        text-decoration: none;
        color: inherit;
        transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
        transform: translateY(-5px);
        border-color: var(--accent);
    }
    .card h2 { color: var(--accent); margin-bottom: 10px; }
    .card p { font-size: 0.9rem; opacity: 0.8; line-height: 1.5; }
</style>
</head>
<body>

    <h1>Mes <span>Projets</span></h1>

    <div class="grid">
        <a href="scotland.html" class="card">
            <h2>🏴󠁧󠁢󠁳󠁣󠁴󠁿 Scotland 2026</h2>
            <p>Itinéraire complet, météo en direct et carte interactive pour mon roadtrip dans les Highlands.</p>
        </a>

        <a href="vitesse_page.html" class="card">
            <h2>⚡ Calculateur de Vitesse</h2>
            <p>Un outil simple pour convertir ton allure (min/km) en km/h. Idéal pour le running.</p>
        </a>
    </div>

</body>
</html>
